[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-approval"
version = "0.3.0"
description = "Prior authorization review with a local Ollama model"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyMuPDF>=1.24,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
medical-approval = "approval.__main__:main"

[tool.setuptools.packages.find]
include = ["approval*"]

[tool.pytest.ini_options]
pythonpath = ["."]
